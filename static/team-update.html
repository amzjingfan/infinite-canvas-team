<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队版本更新</title>
<style>body{margin:0;background:#f5f7fa;color:#172033;font:16px/1.7 system-ui,sans-serif}main{max-width:760px;margin:60px auto;padding:32px;background:white;border:1px solid #dce3ec;border-radius:18px}button,a{font:inherit}button{padding:10px 20px;border:0;border-radius:8px;background:#255ad6;color:white;cursor:pointer;margin-right:12px}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;background:#f3f5f9;padding:18px;border-radius:8px}small{color:#68758b}#result{min-height:32px}a{color:#255ad6}</style></head>
<body><main><a href="/">← 返回首页</a><h1>团队版本更新</h1><p>从团队 GitHub 公开仓库获取正式版本，无需 GitHub 账号或 CLI。画布、素材和平台密钥保留在本机。</p><p id="version">正在读取版本…</p><p><button id="check">检查更新</button><button id="apply" disabled>更新并重启</button></p><p id="result" role="status"></p><pre id="notes">正在读取公开版本说明…</pre><small>更新前请保存画布，完成所有生成和待取回任务。失败时查看下方状态；依赖变化会停止升级，不会擅自覆盖环境。已有工作流、RunningHub 配置和提示词模板保留本地版本。</small></main>
<script>
const check=document.querySelector('#check'),apply=document.querySelector('#apply'),result=document.querySelector('#result'),notes=document.querySelector('#notes');let running=false;
async function get(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d;}
async function inspect(){check.disabled=true;try{const d=await get('/api/team-update/check');document.querySelector('#version').textContent=`当前版本：${d.current}　最新版本：${d.latest?.version||'尚不可访问'}`;notes.textContent=d.error||d.latest?.notes||'当前没有更新说明';apply.disabled=!d.update_available;result.textContent=d.reachable?(d.update_available?'有新版本可用':'已是最新版本'):'无法检查更新，请检查网络或稍后重试，无需登录';}catch(e){result.textContent=e.message;}finally{check.disabled=false;}}
async function poll(){try{const d=await get('/api/team-update/status');if(d.phase!=='idle'){result.textContent=d.message||d.phase;}if(['completed','rolled_back','failed','recovery_required'].includes(d.phase)){running=false;check.disabled=false;apply.disabled=true;return;}if(d.phase!=='idle')running=true;}catch(e){if(running)result.textContent='服务正在重启，等待重新连接…';}if(running)setTimeout(poll,2000);}
check.onclick=inspect;apply.onclick=async()=>{if(!confirm('请确认画布已保存。更新期间不能编辑或生成，是否继续？'))return;apply.disabled=true;check.disabled=true;result.textContent='正在下载和校验…';try{await get('/api/team-update/apply',{method:'POST'});running=true;poll();}catch(e){result.textContent=e.message;check.disabled=false;}};
inspect();poll();
</script></body></html>
